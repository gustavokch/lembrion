    <!-- Structured Data - FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is Lembrion really free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Lembrion is free to use and needs no account. Questions are generated with your own API key from the AI provider you choose (OpenAI, Google Gemini, Anthropic, or DeepSeek), and that provider may charge you for usage. Ollama runs models on your own machine with no API cost."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to create an account?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Lembrion works without registration. Your study sessions, settings, and API keys are saved in your browser's local storage."
          }
        },
        {
          "@type": "Question",
          "name": "What learning techniques does Lembrion use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Lembrion is based on 'Make It Stick'. It quizzes you with active-recall questions, can alternate multiple-choice and open-ended questions in one session, evaluates written answers with AI, and, when elaborative interrogation is enabled, asks a follow-up 'why' question after a wrong answer."
          }
        },
        {
          "@type": "Question",
          "name": "How does the AI generate questions?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Lembrion sends your study topics to the AI provider you configure: OpenAI, Google Gemini, Anthropic, DeepSeek, or an Ollama server. You supply your own API key (Ollama needs none) and can use any model id the provider supports."
          }
        },
        {
          "@type": "Question",
          "name": "Is my data private and secure?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Lembrion has no server and no accounts. Your API keys and study sessions are stored in your browser's local storage. To generate and evaluate questions, your browser sends your study topics, answers, and API key directly to the AI provider you selected, which processes them under its own terms. If you run Ollama locally, requests stay on your machine."
          }
        },
        {
          "@type": "Question",
          "name": "Does Lembrion work on mobile devices?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The interface is responsive and works in mobile and desktop browsers."
          }
        },
        {
          "@type": "Question",
          "name": "What languages does Lembrion support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Lembrion supports English and Portuguese (Brazil). You can switch languages anytime in the settings, and the AI will generate questions in your preferred language."
          }
        }
      ]
    }
    </script>

    <style>
      /* Critical CSS for immediate rendering */
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;

        background: linear-gradient(135deg, #fff7ed 0%, #ffffff 50%, #fff7ed 100%);
        min-height: 100vh;
      }
      
      #root {
        min-height: 100vh;
      }
      
      /* Loading state */
      .loading-spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #ea580c;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Responsive utilities */
      @media (max-width: 640px) {
        body {
          font-size: 14px;
        }
      }
      
      /* High contrast mode support */
      @media (prefers-contrast: high) {
        body {
          background: #ffffff;
        }
      }
      
      /* Reduced motion support */
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
