<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;background:#4b33b5;overflow:hidden}
svg{display:block}
</style></head><body>
<script>
// The lembrion mark: a white ribbon marker, the lowercase l, hanging just under the top edge
// of a Stamp Violet square. ?size=N renders it at N px. The violet band above the ribbon keeps
// the square closed on a light ground; a ribbon running off the edge would merge with a white
// page or tab strip and turn the square into a "u".
//
// ?mask=1 draws the maskable icon: the whole mark scaled by 0.8 about the centre, so the
// ribbon also hangs just under the top of the 80% safe circle that every launcher mask keeps.
//
// Render each size in a browser at device scale factor 1 with an N x N viewport and save a
// PNG screenshot: android-chrome 192 and 512, maskable-icon 512 (?mask=1), logo 512, apple-touch-icon
// 57 (also apple-touch-icon.png), 72, 76, 114, 120, 144, 152 and 180. favicon.ico holds the
// 16, 32 and 48 renders as PNG entries.
//
// The in-app BrandMark (src/components/ui/BrandMark.tsx) uses this geometry on a 512 grid.
const params = new URLSearchParams(location.search);
const size = Number(params.get('size') || 512);
const k = params.get('mask') === '1' ? 0.8 : 1;
const VIOLET = '#4b33b5';
const WHITE = '#ffffff';

// Proportions on a 512 canvas: the ribbon spans x 210-302 and y 32-372.
const RIBBON = 92 / 512;
const TOP = 32 / 512;
const TIP = 372 / 512;

// The ribbon is centred on the pixel grid: an even width on even sizes, odd on odd ones.
// At 16 px the 3 px it would get cannot be centred, so it gets 4.
const HINTED = { 16: 4 };

const width = HINTED[size] ?? Math.max(2, 2 * Math.round((RIBBON * k * size) / 2) + (size % 2));
const left = (size - width) / 2;
// Not `top`: a global `const top` collides with window.top and stops the script.
const start = Math.max(1, Math.round(size / 2 + (TOP - 0.5) * k * size));
const tip = Math.round(size / 2 + (TIP - 0.5) * k * size);
const notch = width / 2; // a 45-degree V
const ribbon = `M${left} ${start}H${left + width}V${tip}L${size / 2} ${tip - notch}L${left} ${tip}Z`;
document.body.innerHTML =
  `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">` +
  `<rect width="${size}" height="${size}" fill="${VIOLET}"/>` +
  `<path fill="${WHITE}" d="${ribbon}"/>` +
  `</svg>`;
document.body.setAttribute('data-ready', '1');
</script>
</body></html>
